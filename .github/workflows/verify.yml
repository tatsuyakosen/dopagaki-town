name: Verify public source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r requirements-city.txt
      - run: npm run check:publish
      - run: npm run check:publish -- --history
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:city-converter
      - run: npm run build
      - run: npm run check:city-bundle
      - run: npm audit --audit-level=high
      # Never upload traces, env files, raw city data, or arbitrary workspaces.
